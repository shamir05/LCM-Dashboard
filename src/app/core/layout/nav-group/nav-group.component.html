<button
  class="nav-group__toggle"
  type="button"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-controls]="listId"
  [attr.title]="collapsed() ? group().label : null"
  (click)="toggle()"
>
  <app-icon [name]="group().icon" />
  <span class="nav-group__label">{{ group().label }}</span>
  <app-icon class="nav-group__chevron" name="chevron-down" />
</button>

<ul class="nav-group__list" [id]="listId" [hidden]="!isOpen()">
  @for (child of group().children; track child.route) {
    <li>
      <app-nav-item [link]="child" />
    </li>
  }
</ul>
