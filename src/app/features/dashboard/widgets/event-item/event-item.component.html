<div class="event-item__text">
  <p class="event-item__title" [title]="event().title">{{ event().title }}</p>
  <p class="event-item__time">{{ timeRange() }}</p>
</div>

@if (event().meetingUrl; as meetingUrl) {
  <a
    class="event-item__meet"
    [href]="meetingUrl"
    target="_blank"
    rel="noopener noreferrer"
    [title]="joinLabel"
    [attr.aria-label]="meetingLabel()"
  >
    <app-icon name="google-meet" [size]="meetIconSize" />
  </a>
}
